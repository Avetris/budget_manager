 <mat-card>
    <mat-card-header>
        <mat-card-title>{{ 'login.title' | transloco }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <form [formGroup]="form" (ngSubmit)="submit()">
            <mat-form-field>
                <input type="text" matInput [placeholder]="'login.user'  | transloco" formControlName="user">
            </mat-form-field>

            <mat-form-field>
                <input type="password" matInput [placeholder]="'login.password' | transloco" formControlName="password">
            </mat-form-field>

            @if(error) {
                <p class="error">
                    {{ error | transloco }}
                </p>
            }
            <div class="button">
            <button type="submit" mat-button>Login</button>
            </div>

        </form>
    </mat-card-content>
</mat-card>
