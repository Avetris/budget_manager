<div class="placeholder-dashboard animate-fade-in">
  <div class="dashboard-header-bar">
    <div class="dashboard-title-group">
      <h2 class="dashboard-title">{{ 'tabs.clients' | transloco }}</h2>
      <span class="results-badge">{{ 'generic.items' | transloco: {items: 0} }}</span>
    </div>
    <button mat-raised-button color="primary" class="create-btn">
      <mat-icon>person_add</mat-icon>
      <span>{{ 'clients.add' | transloco }}</span>
    </button>
  </div>

  <div class="empty-state-card">
    <div class="empty-state-icon-box">
      <mat-icon class="empty-icon">people_outline</mat-icon>
    </div>
    <h3 class="empty-state-title">{{ 'clients.title' | transloco }}</h3>
    <p class="empty-state-desc">{{ 'clients.subtitle' | transloco }}</p>
  </div>
</div>
