plugins {
    id 'application'
    id 'org.beryx.runtime' version '1.13.1'
}

repositories {
    mavenCentral()
}

dependencies {
    // Add your project dependencies here
    implementation("com.google.code.gson:gson:2.7")
    implementation("org.codehaus.jackson:jackson-core-asl:1.1.0")
    implementation("com.itextpdf:itextpdf:5.0.6")
}

application {
    // Define the application properties
    mainClass = 'com.avetris.Main'
    applicationName = 'Presupuestos'
    version = '1.0.0'
}

jar {
    manifest {
        attributes 'Main-Class': 'com.avetris.Main'
    }
}

runtime {
    additive = true
    modules = ['java.desktop', 'java.naming']
    options = ['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages']

    jpackage {
        def currentOs = org.gradle.internal.os.OperatingSystem.current()

        if(currentOs.windows) {
            installerOptions += ['--win-per-user-install', '--win-dir-chooser', '--win-menu', '--win-shortcut']
            installerOptions += ['--icon', project.file('src/main/resources/icon.ico').absolutePath]
        } else if(currentOs.osx) {
            addOptions('--icon', project.file('src/main/resources/icon.icns').absolutePath)
        }
        // The following commented section can be removed if not planned for use.
        /*targetPlatform("win") {
            jdkHome = jdkDownload("https://download.oracle.com/java/17/archive/jdk-17.0.12_windows-x64_bin.zip")
            addOptions('--win-per-user-install', '--win-dir-chooser', '--win-menu', '--win-shortcut')
        }
        installerOptions += [] // This line might be a remnant and can likely be removed.
        targetPlatform("mac") {
            jdkHome = jdkDownload("https://download.oracle.com/java/17/archive/jdk-17.0.12_macos-x64_bin.tar.gz") {
                downloadDir = "$buildDir\\myMac"
                archiveName = "my-mac-jdk"
                archiveExtension = "tar.gz"
                pathToHome = "jdk-17.0.12.jdk/Contents/Home"
                overwrite = true
            }
            addOptions('--mac-package-name', 'prestamos')
        }*/
    }
}

java {
  toolchain {
    languageVersion.set(JavaLanguageVersion.of(17))
  }
}

// Helper function to configure common properties for jpackage tasks
def configureJPackageTask(task, String platformDisplayName) {
    task.group = "distribution"
    task.description = "Creates a platform-specific package for ${platformDisplayName}."

    task.mainJar.set(tasks.jar.archiveFile)
    task.mainClass.set(application.mainClass)
    task.applicationName.set(application.applicationName)
    task.appVersion.set(application.version)

    // Ensures the custom runtime image is built before packaging
    task.dependsOn(tasks.named('jlinkImage'))

    // These jlink options are applied when creating the runtime image via the 'jlinkImage' task
    // They don't need to be repeated here as JPackageTask uses the output of jlinkImage.
    // task.jlinkOptions.set(project.runtime.options)
}

compileJava.options.encoding = 'UTF-8'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.release = 17
}
