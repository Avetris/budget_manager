plugins {
    id 'application'
    id 'org.beryx.runtime' version '1.13.1'
}

repositories {
    mavenCentral()
}

dependencies {
    // Add your project dependencies here
    implementation("com.google.code.gson:gson:2.7")
    implementation("org.codehaus.jackson:jackson-core-asl:1.1.0")
    implementation("com.itextpdf:itextpdf:5.0.6")
}

application {
    // Define the application properties
    mainClass = 'com.avetris.Main'
    applicationName = 'Presupuestos'
    version = '1.0.0'
}

jar {
    manifest {
        attributes 'Main-Class': 'com.avetris.Main'
    }
}

runtime {
    additive = true
    modules = ['java.desktop', 'java.naming']
    options = ['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages']

    // Configure for macOS Intel (x86_64) build if property is set
    // This allows overriding the JDK used by jlink and jpackage.
    // On CI, ensure JAVA_HOME points to an x86_64 JDK for macOS builds.
    def currentOsForJdkConfig = org.gradle.internal.os.OperatingSystem.current()
    if (currentOsForJdkConfig.isMacOsX()) {
        if (project.hasProperty('macos.x64.jdk.path')) {
            def jdkPath = project.property('macos.x64.jdk.path') as String
            if (new File(jdkPath).isDirectory()) {
                project.logger.lifecycle("Using explicit x86_64 JDK for macOS jlink/jpackage: ${jdkPath}")
                jlinkJdk = jdkPath
                jpackageJdk = jdkPath
            } else {
                project.logger.warn("Specified macos.x64.jdk.path ('${jdkPath}') not found or not a directory. Default JDK (JAVA_HOME) will be used for jlink/jpackage.")
            }
        } else {
            project.logger.info("Property 'macos.x64.jdk.path' not set. Default JDK (JAVA_HOME) will be used for macOS jlink/jpackage. Ensure JAVA_HOME points to an x86_64 JDK for Intel builds on CI, or set macos.x64.jdk.path for local cross-compilation.")
        }
    }

    jpackage {
        def currentOs = org.gradle.internal.os.OperatingSystem.current()

        if(currentOs.isWindows()) {
            installerOptions += ['--win-per-user-install', '--win-dir-chooser', '--win-menu', '--win-shortcut']
            installerOptions += ['--icon', project.file('src/main/resources/icon.ico').absolutePath]
            imageOptions += ['--icon', project.file('src/main/resources/icon.ico').absolutePath]
        } else if(currentOs.isMacOsX()) {
            installerOptions += ['--icon', project.file('icon.icns').absolutePath]
            imageOptions += ['--icon', project.file('icon.icns').absolutePath]
            installerType = 'pkg' // Specify PKG installer for macOS
        }
    }
}

java {
  toolchain {
    languageVersion.set(JavaLanguageVersion.of(17))
  }
}

// Helper function to configure common properties for jpackage tasks
def configureJPackageTask(task, String platformDisplayName) {
    task.group = "distribution"
    task.description = "Creates a platform-specific package for ${platformDisplayName}."

    task.mainJar.set(tasks.jar.archiveFile)
    task.mainClass.set(application.mainClass)
    task.applicationName.set(application.applicationName)
    task.appVersion.set(application.version)

    // Ensures the custom runtime image is built before packaging
    task.dependsOn(tasks.named('jlinkImage'))

    // These jlink options are applied when creating the runtime image via the 'jlinkImage' task
    // They don't need to be repeated here as JPackageTask uses the output of jlinkImage.
    // task.jlinkOptions.set(project.runtime.options)
}

compileJava.options.encoding = 'UTF-8'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.release = 17
}
