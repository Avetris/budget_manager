name: Gradle Build

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macOS-latest, windows-latest]
        java: [ '15.0.1' ]
      fail-fast: false
    name: ${{ matrix.os }}
    steps:
    - name: Git checkout
      uses: actions/checkout@v4
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
    - name: Echo JAVA_HOME
      run: echo "JAVA_HOME is $env:JAVA_HOME" # More robust echo for PowerShell (Windows default) and Bash
    - name: Verify Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v3
    - name: Give permissions
      run: chmod +x ./gradlew
    - name: Execute build
      run: ./gradlew --info --stacktrace build
    - name: Execute runtime
      run: ./gradlew --info --stacktrace runtime
    - name: Execute jpackage
      run: ./gradlew --info --stacktrace jpackage
    - name: Upload DMG as an artifact
      uses: actions/upload-artifact@v4
      if: runner.os == 'macOS'
      with:
        name: budget${{ matrix.java }}-${{ matrix.os }}-dmg
        path: build/jpackage/*.dmg
    - name: Upload EXE as an artifact
      uses: actions/upload-artifact@v4
      if: runner.os == 'Windows'
      with:
        name: budget${{ matrix.java }}-${{ matrix.os }}-exe
        path: build/jpackage/*.exe
    - name: Upload MSI as an artifact
      uses: actions/upload-artifact@v4
      if: runner.os == 'Windows'
      with:
        name: budget${{ matrix.java }}-${{ matrix.os }}-msi
        path: build/jpackage/*.msi

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build # Ensures this job runs only after all matrix builds are successful
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') # Only run on tag pushes
    permissions:
      contents: write # Required to create a release and upload assets
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts # All artifacts will be downloaded into subdirectories here

      - name: List downloaded artifacts (for debugging)
        run: ls -R artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/budget*-macOS-latest-dmg/*.dmg
            artifacts/budget*-windows-latest-exe/*.exe
            artifacts/budget*-windows-latest-msi/*.msi
          # The tag_name, release name, and body are often inferred or can be customized further